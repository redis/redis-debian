name: "Build source package"
description: "Build a Debian source package (.dsc + tarball) for a given distribution"

inputs:
  dist:
    description: "Distribution to build for"
    required: true
  release_tag:
    description: "Release tag to build for (value 'unstable' is supported)"
    required: false

runs:
  using: "composite"
  steps:
  - name: Install dependencies
    shell: bash
    run: |
      sudo apt-get update && \
      sudo apt-get install \
      debhelper dput tcl-tls libsystemd-dev pkgconf cmake clang libssl-dev
  - name: Determine version
    id: determine-version
    shell: bash
    run: |
      # MODULES_UPDATE=1 means the tarball has no bundled modules and needs 'make modules-update'.
      if [ "${{ inputs.release_tag }}" == "unstable" ]; then
        VERSION="unstable"
        URL="https://github.com/redis/redis/archive/refs/heads/${VERSION}.tar.gz"
        MODULES_UPDATE=1
      else
        # Version format:
        # https://www.debian.org/doc/debian-policy/ch-controlfields.html#version
        VERSION=$(head -1 debian/changelog | awk '{print $2}' | sed 's/(\([0-9]\+:\)\?\(.*\)-[^-]\+)$/\2/g')
        FULL_URL="https://github.com/redis/redis/releases/download/${VERSION}/redis-full.tar.gz"
        TAG_URL="https://github.com/redis/redis/archive/refs/tags/${VERSION}.tar.gz"

        if ! HTTP_CODE=$(curl --silent --show-error --location --head --output /dev/null --write-out '%{http_code}' "$FULL_URL"); then
          echo "Failed to check $FULL_URL" >&2
          exit 1
        fi
        case "$HTTP_CODE" in
          2*)
            # Public release: redis-full archive already bundles the modules.
            URL="$FULL_URL"
            MODULES_UPDATE=0
            ;;
          404)
            # Internal release: tag has no redis-full archive, fetch modules via 'make modules-update'.
            URL="$TAG_URL"
            MODULES_UPDATE=1
            ;;
          *)
            echo "Unexpected HTTP status while checking $FULL_URL: $HTTP_CODE" >&2
            exit 1
            ;;
        esac
      fi
      echo "VERSION=${VERSION}" >> $GITHUB_ENV
      echo "Determined version $VERSION"
      echo "URL=${URL}"
      echo "URL=${URL}" >> $GITHUB_OUTPUT
      echo "MODULES_UPDATE=${MODULES_UPDATE}" >> $GITHUB_ENV
  - name: Get source tarball
    shell: bash
    run: |
      curl --fail --silent --show-error --location "${{ steps.determine-version.outputs.URL }}" -o redis_${VERSION}.orig.tar.gz
  - name: Build source package
    shell: bash
    run: |
      mkdir -p redis-${VERSION}
      tar --extract --gunzip --file redis_${VERSION}.orig.tar.gz --strip-components=1 -C redis-${VERSION}

      # Only fetch modules when needed and when this source tree defines them via modules/modules.yaml.
      if [ "$MODULES_UPDATE" == "1" ] && [ -f redis-${VERSION}/modules/modules.yaml ]; then
        if [ "${{ inputs.release_tag }}" == "unstable" ]; then
          echo "===== Pinning all bundled modules to 'master' ====="
          ( cd redis-${VERSION} && yq -i '.modules[].ref = "master"' modules/modules.yaml )
        fi
        echo "===== Cloning module sources (shallow) ====="
        ( cd redis-${VERSION} && make modules-update MODULES_UPDATE_SHALLOW=1 )
        echo "===== Module sources cloned ====="
      fi

      cp -pr debian redis-${VERSION}
      sed -i "s/@RELEASE@/${{ inputs.dist }}/g" redis-${VERSION}/debian/changelog
      ( cd redis-${VERSION} && dpkg-buildpackage -S )
  - name: Upload source package artifact
    uses: actions/upload-artifact@v7
    with:
      name: source-${{ inputs.dist }}
      path: |
        redis_*.tar.xz
        redis_*.dsc
        redis_*.orig.tar.gz
